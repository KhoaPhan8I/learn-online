<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Learn Online — Chợ kỹ năng</title>
<style>
:root{--bg:#0f0f14;--bg2:#17171f;--surface:#1d1d27;--surface2:#24242f;--line:rgba(255,255,255,.08);--txt:#f4f4f6;--mut:#a7a7b8;--acc:#fe2c55;--acc2:#25f4ee;--gold:#fbbf24;--r:16px;--bar-top:70px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(254,44,85,.14),transparent 60%),radial-gradient(900px 500px at 10% 0%,rgba(37,244,238,.08),transparent 55%),var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom);min-height:100vh}
button,input,textarea,select{touch-action:manipulation;font-family:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:10;background:rgba(15,15,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
header h1 .grad{background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{font-size:12px;color:var(--mut)}
#stats{font-size:12px;color:var(--mut);margin-top:4px}
main{max-width:640px;margin:0 auto;padding:12px 12px 80px}
.card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.35);animation:rise .45s cubic-bezier(.2,.8,.25,1) both}
#feed .card:nth-child(2){animation-delay:.06s}#feed .card:nth-child(3){animation-delay:.12s}#feed .card:nth-child(4){animation-delay:.18s}#feed .card:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.composer{border:1px solid rgba(254,44,85,.25);background:linear-gradient(180deg,rgba(254,44,85,.08),var(--surface) 40%)}
.composer .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.composer .tabs button{flex:1;min-width:70px;min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--txt);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.composer .tabs button:hover{transform:translateY(-1px)}
.composer .tabs button.on{background:linear-gradient(135deg,var(--acc),#ff5c39);border-color:transparent;box-shadow:0 4px 14px rgba(254,44,85,.45)}
.row{display:flex;gap:8px;margin-bottom:8px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#101018;color:var(--txt);border-radius:12px;padding:9px 12px;min-height:44px;font-size:16px;font-family:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(254,44,85,.18);outline:none}
input::placeholder,textarea::placeholder{color:#6b6b7d}
textarea{resize:vertical;min-height:64px}
.half{flex:1}
.btn{background:linear-gradient(135deg,var(--acc),#ff5c39);color:#fff;border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:transform .12s,box-shadow .2s,filter .2s;box-shadow:0 4px 14px rgba(254,44,85,.35)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--txt);border:1px solid var(--line);box-shadow:none;width:auto;padding:8px 14px}
.stickybar{position:sticky;top:var(--bar-top,70px);z-index:5;background:rgba(15,15,20,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 0 4px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:8px;margin:6px 0 10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:var(--surface2);color:var(--txt);border-radius:999px;padding:6px 16px;min-height:44px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,transform .15s}
.filters button:hover{transform:translateY(-1px)}
.filters button.on{background:var(--txt);color:#111;border-color:var(--txt)}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:42px;height:42px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#0b0b10;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.who{flex:1}.who b{font-size:14px}.who small{color:var(--mut);font-size:12px;display:block}
.tag{font-size:11px;font-weight:700;background:rgba(37,244,238,.14);color:var(--acc2);border:1px solid rgba(37,244,238,.3);border-radius:999px;padding:4px 10px}
.price{font-size:11px;background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.3);border-radius:999px;padding:4px 10px;font-weight:700}
.post-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px;line-height:1.35}
.post-body{font-size:14px;color:#d6d6e0;margin-bottom:10px;white-space:pre-wrap;line-height:1.6}
video,img.media{width:100%;border-radius:14px;margin-bottom:10px;background:#000;aspect-ratio:16/9;object-fit:cover;max-height:360px;border:1px solid var(--line)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{width:auto;flex:1;border-radius:12px}
.iconbtn{min-width:44px;min-height:44px;flex:0 0 44px !important}
.like{background:var(--surface2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.like.liked{background:rgba(254,44,85,.16);color:#ff6b8a;border-color:rgba(254,44,85,.5);animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.opt{display:block;width:100%;min-height:44px;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--txt);border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:14px;font-weight:600;cursor:pointer;transition:border-color .2s,transform .12s}
.opt:hover{border-color:var(--acc);transform:translateX(2px)}
.bar{position:relative;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;font-size:14px;background:var(--surface2)}
.bar i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(254,44,85,.55),rgba(255,92,57,.45))}
.bar span{position:relative;display:block;padding:10px 12px;font-weight:600}
.bar b{float:right;color:var(--gold)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(90px);background:#23232e;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;transition:transform .3s cubic-bezier(.2,.8,.25,1);z-index:20;max-width:92%;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#toast.show{transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cmts{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.cmt{font-size:13px;margin-bottom:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.cmt b{font-size:13px;color:var(--acc2)}
.cmt-row{display:flex;gap:6px;margin-top:6px}
.cmt-row input{flex:1;padding:9px 12px;font-size:16px}
.cmt-row button{width:auto;padding:7px 14px;font-size:13px}
@media(max-width:420px){.actions{flex-wrap:wrap}.post-title{font-size:17px}main{padding:10px 10px 80px}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<header>
<div class="hwrap"><div class="logo">🎓</div><div><h1>Learn <span class="grad">Online</span></h1>
<p>Chợ kỹ năng — ai cũng dạy được, ai cũng học được</p>
<p id="stats" aria-live="polite"></p></div></div>
</header>
<main>
<section class="card composer">
<div class="tabs" role="tablist" aria-label="Loại bài đăng">
<button data-t="video" class="on" role="tab" aria-selected="true" aria-controls="pane-video">🎬 Video</button>
<button data-t="image" role="tab" aria-selected="false" aria-controls="pane-image">🖼️ Bài viết</button>
<button data-t="text" role="tab" aria-selected="false" aria-controls="pane-text">✍️ Text</button>
<button data-t="poll" role="tab" aria-selected="false" aria-controls="pane-poll">📊 Poll</button>
</div>
<div class="row">
<label class="sr-only" for="f-name">Tên bạn (bắt buộc)</label><input id="f-name" class="half" placeholder="Tên bạn *" aria-label="Tên bạn (bắt buộc)">
<label class="sr-only" for="f-skill">Kỹ năng của bạn</label><input id="f-skill" class="half" placeholder="Kỹ năng (VD: Guitar)" aria-label="Kỹ năng của bạn">
</div>
<div id="pane-video" role="tabpanel">
<label class="sr-only" for="f-vtitle">Tên khóa học (bắt buộc)</label><input id="f-vtitle" placeholder="Tên khóa học / kỹ năng muốn dạy *" aria-label="Tên khóa học (bắt buộc)" style="margin-bottom:8px">
<label class="sr-only" for="f-vurl">Link video mp4</label><input id="f-vurl" placeholder="Link video mp4 (để trống = video demo)" aria-label="Link video mp4 (https, để trống = video demo)" style="margin-bottom:8px">
<label class="sr-only" for="f-vfile">Chọn video từ máy (tối đa 8MB)</label><input type="file" id="f-vfile" accept="video/*" aria-label="Chọn video từ máy (tối đa 8MB)" style="margin-bottom:8px">
<label class="sr-only" for="f-vdesc">Mô tả khóa học</label><textarea id="f-vdesc" placeholder="Mô tả ngắn: học được gì, lịch rảnh khi nào..." aria-label="Mô tả khóa học"></textarea>
</div>
<div id="pane-image" role="tabpanel" hidden>
<label class="sr-only" for="f-ititle">Tiêu đề bài viết (bắt buộc)</label><input id="f-ititle" placeholder="Tiêu đề bài viết *" aria-label="Tiêu đề bài viết (bắt buộc)" style="margin-bottom:8px">
<label class="sr-only" for="f-iurl">Link ảnh minh họa</label><input id="f-iurl" placeholder="Link ảnh (để trống = ảnh mẫu)" aria-label="Link ảnh minh họa (https, để trống = ảnh mẫu)" style="margin-bottom:8px">
<label class="sr-only" for="f-ifile">Chọn ảnh từ máy (tối đa 3MB)</label><input type="file" id="f-ifile" accept="image/*" aria-label="Chọn ảnh từ máy (tối đa 3MB)" style="margin-bottom:8px">
<label class="sr-only" for="f-idesc">Nội dung bài viết</label><textarea id="f-idesc" placeholder="Nội dung chia sẻ..." aria-label="Nội dung bài viết"></textarea>
</div>
<div id="pane-text" role="tabpanel" hidden>
<label class="sr-only" for="f-ttitle">Tiêu đề (bắt buộc)</label><input id="f-ttitle" placeholder="Tiêu đề *" aria-label="Tiêu đề (bắt buộc)" style="margin-bottom:8px">
<label class="sr-only" for="f-tbody">Nội dung (bắt buộc)</label><textarea id="f-tbody" placeholder="Viết ngắn gọn điều bạn muốn dạy..." aria-label="Nội dung (bắt buộc)"></textarea>
</div>
<div id="pane-poll" role="tabpanel" hidden>
<label class="sr-only" for="f-q">Câu hỏi khảo sát (bắt buộc)</label><input id="f-q" placeholder="Câu hỏi khảo sát *" aria-label="Câu hỏi khảo sát (bắt buộc)" style="margin-bottom:8px">
<div id="poll-opts">
<input placeholder="Lựa chọn 1" aria-label="Lựa chọn 1" style="margin-bottom:8px">
<input placeholder="Lựa chọn 2" aria-label="Lựa chọn 2" style="margin-bottom:8px">
</div>
<button class="btn ghost" id="add-opt" type="button">+ Thêm lựa chọn</button>
</div>
<div class="row"><label class="sr-only" for="f-contact">Thông tin liên hệ</label><input id="f-contact" placeholder="Liên hệ (SĐT / Zalo / link FB...)" aria-label="Thông tin liên hệ"></div>
<div class="row" style="margin-top:8px">
<label class="sr-only" for="f-price">Học phí (trống = miễn phí)</label><input id="f-price" class="half" placeholder="Học phí (trống = miễn phí)" aria-label="Học phí (trống = miễn phí)">
<button class="btn half" id="publish">Đăng bài</button>
<button class="btn ghost half" id="cancel-edit" hidden>Hủy</button>
</div>
<p class="hint">Ngại quay video? Đăng text hoặc poll vẫn được — hạ rào cản chia sẻ. Video tải lên tối đa 8MB, ảnh tối đa 3MB; link media chỉ nhận https:// hoặc file vừa chọn.</p>
</section>
<div class="stickybar">
<div class="row"><label class="sr-only" for="q">Tìm kiếm bài viết</label><input id="q" placeholder="🔍 Tìm kỹ năng, tên, tiêu đề..." aria-label="Tìm kiếm bài viết"><label class="sr-only" for="sort">Sắp xếp bài viết</label><select id="sort" class="half" style="max-width:160px" aria-label="Sắp xếp bài viết"><option value="new">Mới nhất</option><option value="liked">❤ Nhiều nhất</option><option value="regs">📝 Đăng ký nhiều</option><option value="random">🎲 Ngẫu nhiên</option></select></div>
<nav class="filters" id="filters" aria-label="Lọc bài viết theo loại">
<button data-f="all" class="on" aria-pressed="true">Tất cả</button>
<button data-f="video" aria-pressed="false">🎬 Video</button>
<button data-f="image" aria-pressed="false">🖼️ Bài viết</button>
<button data-f="text" aria-pressed="false">✍️ Text</button>
<button data-f="poll" aria-pressed="false">📊 Poll</button>
<button data-f="mine" aria-pressed="false">👤 Bài của tôi</button>
<button data-f="free" aria-pressed="false">🆓 Miễn phí</button>
<button data-f="joined" aria-pressed="false">✅ Đã đăng ký</button>
</nav>
</div>
<section id="feed" aria-label="Danh sách bài viết"></section>
<p class="hint" style="text-align:center;margin:16px 0 4px"><button class="btn ghost" id="export" type="button" aria-label="Tải bản sao lưu dữ liệu">⬇ Sao lưu</button> <button class="btn ghost" id="import-btn" type="button" aria-label="Khôi phục dữ liệu từ file sao lưu">⬆ Khôi phục</button><input type="file" id="import" accept="application/json" hidden aria-label="Chọn file sao lưu JSON"></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const LS='learn-online-posts-v2', VOTED='learn-online-voted-v2', ME='learn-online-me-v2';
let cur='video', filter='all', editId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numId=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const sameId=(a,b)=>{if(a===null||a===undefined||typeof a==='object')return false;return numId(a)!==null&&numId(a)===numId(b)};
const findPost=id=>posts.find(x=>x&&typeof x==='object'&&sameId(x.id,id));
const safeUrl=u=>{if(typeof u!=='string')return '';const t=u.trim();if(/^(https?:\/\/|data:image\/|data:video\/)/i.test(t)&&!/[\s<>"]/i.test(t))return t;return ''};
function cleanPost(p){if(!p||typeof p!=='object'||Array.isArray(p))return null;const id=numId(p.id);if(id===null)return null;const types=['video','image','text','poll'];const type=types.includes(p.type)?p.type:'';const o={id,type,name:typeof p.name==='string'?p.name.slice(0,80):'',skill:typeof p.skill==='string'?p.skill.slice(0,80):'',price:typeof p.price==='string'?p.price.slice(0,80):'',contact:typeof p.contact==='string'?p.contact.slice(0,200):'',title:typeof p.title==='string'?p.title.slice(0,200):'',body:typeof p.body==='string'?p.body.slice(0,5000):'',media:typeof p.media==='string'?(p.media.length>300000?'':p.media):'',mine:p.mine?1:0,liked:!!p.liked,likes:Math.max(0,Math.min(1e6,Number(p.likes)||0)),ts:Number.isFinite(Number(p.ts))?Number(p.ts):Date.now(),regs:Array.isArray(p.regs)?p.regs.filter(x=>typeof x==='string').map(x=>x.slice(0,80)).slice(0,1000):[],cmts:Array.isArray(p.cmts)?p.cmts.filter(c=>c&&typeof c==='object').slice(0,500).map(c=>({n:String(c.n||'').slice(0,80),t:String(c.t||'').slice(0,1000)})):[]};if(type==='poll'){o.options=Array.isArray(p.options)?p.options.slice(0,10).map(x=>({t:x&&typeof x.t==='string'?x.t.slice(0,120):'',v:Math.max(0,Math.min(1e6,Number(x&&x.v)||0))})).filter(x=>x.t):[]}return o}
function load(){try{const v=JSON.parse(localStorage.getItem(LS));return Array.isArray(v)?v:null}catch(e){return null}}
function save(p){try{localStorage.setItem(LS,JSON.stringify(p));return true}catch(e){toast('Không lưu được (bộ nhớ đầy hoặc chế độ riêng tư)');return false}}
function voted(){try{const v=JSON.parse(localStorage.getItem(VOTED));return (v&&typeof v==='object'&&!Array.isArray(v))?v:{}}catch(e){return{}}}
let _l=load();let posts=(_l||[]).map(cleanPost).filter(Boolean);try{if(localStorage.getItem(LS)===null)save(posts)}catch(e){}
try{const _h=document.querySelector('header');if(_h&&_h.offsetHeight)document.documentElement.style.setProperty('--bar-top',(_h.offsetHeight+6)+'px')}catch(e){}
function ago(ts){ts=Number(ts);if(!Number.isFinite(ts))return'không rõ thời gian';const m=Math.floor((Date.now()-ts)/6e4);if(m<1)return'vừa xong';if(m<60)return m+' phút trước';const h=Math.floor(m/60);if(h<24)return h+' giờ trước';return Math.floor(h/24)+' ngày trước'}
function toast(m){const t=$('toast');if(!t)return;t.innerHTML='';const s=document.createElement('span');s.textContent=String(m??'');t.appendChild(s);const b=document.createElement('button');b.textContent='✕';b.setAttribute('aria-label','Đóng thông báo');b.style.cssText='margin-left:10px;background:none;border:0;color:#fff;font-size:14px;cursor:pointer;min-width:44px;min-height:44px';b.onclick=()=>t.classList.remove('show');t.appendChild(b);t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),3500)}
function media(p){
const s=safeUrl(p.media);
if(p.type==='video'&&s)return `<video controls playsinline preload="metadata" src="${esc(s)}" aria-label="Video bài giảng: ${esc(p.title||'không tiêu đề')}"></video>`;
if(p.type==='image'&&s)return `<img class="media" src="${esc(s)}" loading="lazy" alt="${esc(p.title||'Ảnh minh họa bài viết')}">`;
return '';
}
function pollHtml(p,id){
const opts=Array.isArray(p.options)?p.options:[];
if(!opts.length)return '<p class="hint">Poll chưa có lựa chọn nào.</p>';
const total=opts.reduce((a,o)=>a+(Number(o&&o.v)||0),0)||1;
const v=voted();
if(v[id])return opts.map((o,i)=>{const vv=Number(o&&o.v)||0,t=typeof o?.t==='string'?o.t:'';const pc=Math.round(vv/total*100);const mine=v[id]===i+1?' ✓':'';return `<button class="opt" id="vote-${id}-${i}" onclick="vote(${id},${i})" aria-label="Đổi sang ${esc(t)} (hiện ${pc}%)"><div class="bar" style="margin:0;border:0" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(t)}: ${pc} phần trăm"><i style="width:${pc}%"></i><span>${esc(t)}${mine} <b>${pc}%</b></span></div></button>`}).join('')+`<p class="hint">${total} lượt vote — bấm để đổi lựa chọn</p>`;

function cmtHtml(p,id,nm){

function card(p){

window.cmt=id=>{const nid=numId(id);if(nid===null)return;const inp=$('c-'+nid);if(!inp)return toast('Không tìm thấy ô bình luận');const t=(inp.value||'').trim().slice(0,1000);if(!t)return toast('Nhập bình luận đã');const n=(($('f-name').value||'').trim()||'Khách').slice(0,80);const p=findPost(id);if(!p)return;p.cmts=Array.isArray(p.cmts)?p.cmts:[];p.cmts.push({n,t});if(!save(posts)){p.cmts.pop();return}render();toast('Đã gửi bình luận!')};

cur=['video','image','text','poll'].includes(p.type)?p.type:'video';document.querySelectorAll('.composer .tabs button').forEach(x=>{const on=x.dataset.t===cur;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false')});

(function(){const tb=[...document.querySelectorAll('.composer .tabs button')];tb.forEach((b,i)=>{b.tabIndex=b.classList.contains('on')?0:-1;if(!b.addEventListener)return;b.addEventListener('keydown',e=>{let j=null;if(e.key==='ArrowRight')j=(i+1)%tb.length;else if(e.key==='ArrowLeft')j=(i-1+tb.length)%tb.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tb.length-1;if(j!==null&&j!==undefined){e.preventDefault();tb[j].focus();tb[j].click()}})})})();
